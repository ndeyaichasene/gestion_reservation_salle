name: Build and Push Docker Images to Docker Hub

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_scope:
        description: 'Tags to build: "all" for all git tags, or a specific tag (e.g. v0.8.0)'
        required: true
        default: 'all'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Save Docker build assets
        run: |
          mkdir -p /tmp/docker-assets
          cp Dockerfile /tmp/docker-assets/Dockerfile
          [ -f .dockerignore ] && cp .dockerignore /tmp/docker-assets/.dockerignore || true

      - name: Build and Push Docker Image(s)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO_NAME: gestion_reservation_salle
        run: |
          # Identifier la liste des tags à traiter
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS_TO_BUILD=("${{ github.ref_name }}")
          elif [ "${{ github.event.inputs.tag_scope }}" = "all" ]; then
            git fetch --tags
            TAGS_TO_BUILD=($(git tag -l --sort=v:refname))
          else
            TAGS_TO_BUILD=("${{ github.event.inputs.tag_scope }}")
          fi

          echo "Tags to build and push: ${TAGS_TO_BUILD[*]}"
          
          # Obtenir le tag le plus récent pour taguer également :latest
          LATEST_TAG=$(git tag -l --sort=v:refname | tail -n 1)
          echo "Latest tag is: $LATEST_TAG"

          for tag in "${TAGS_TO_BUILD[@]}"; do
            echo "=========================================="
            echo "Building image for tag: $tag"
            echo "=========================================="
            
            git checkout "$tag"
            
            # S'assurer que le Dockerfile existe même sur les anciens commits
            if [ ! -f Dockerfile ]; then
              echo "Dockerfile absent sur $tag, copie du Dockerfile de référence"
              cp /tmp/docker-assets/Dockerfile ./Dockerfile
              [ -f /tmp/docker-assets/.dockerignore ] && cp /tmp/docker-assets/.dockerignore ./.dockerignore || true
            fi
            
            IMAGE_TAG="${DOCKERHUB_USERNAME}/${REPO_NAME}:${tag}"
            EXTRA_TAGS=""
            if [ "$tag" = "$LATEST_TAG" ]; then
              EXTRA_TAGS="-t ${DOCKERHUB_USERNAME}/${REPO_NAME}:latest"
            fi
            
            docker buildx build \
              --platform linux/amd64 \
              -t "$IMAGE_TAG" \
              $EXTRA_TAGS \
              --push \
              .
              
            echo "Pushed $IMAGE_TAG successfully"
          done
