name: Build and Push Docker Images to Docker Hub

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_scope:
        description: 'Tags to build: "all" for all git tags, or a specific tag (e.g. v0.8.0)'
        required: true
        default: 'all'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Save Docker build assets
        run: |
          mkdir -p /tmp/docker-assets
          cp Dockerfile /tmp/docker-assets/Dockerfile
          [ -f .dockerignore ] && cp .dockerignore /tmp/docker-assets/.dockerignore || true

      - name: Build and Push Docker Image(s)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO_NAME: gestion_reservation_salle
        run: |
          # Normaliser le nom d'utilisateur en minuscules pour Docker Hub
          DOCKER_USER=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          
          # Identifier la liste des tags à traiter
          if [ "${{ github.event_name }}" = "push" ]; then
            TAGS_TO_BUILD=("${{ github.ref_name }}")
          elif [ "${{ github.event.inputs.tag_scope }}" = "all" ]; then
            git fetch --tags
            TAGS_TO_BUILD=($(git tag -l --sort=v:refname))
          else
            TAGS_TO_BUILD=("${{ github.event.inputs.tag_scope }}")
          fi

          echo "Tags to build and push: ${TAGS_TO_BUILD[*]}"
          
          # Obtenir le tag le plus récent pour taguer également :latest
          LATEST_TAG=$(git tag -l --sort=v:refname | tail -n 1)
          echo "Latest tag is: $LATEST_TAG"

          for tag in "${TAGS_TO_BUILD[@]}"; do
            echo "=========================================="
            echo "Building image for tag: $tag"
            echo "=========================================="
            
            # Nettoyer l'arbre de travail et basculer sur le tag
            git reset --hard
            git clean -fd
            git checkout -f "$tag"
            
            # S'assurer que le Dockerfile de référence est présent
            cp /tmp/docker-assets/Dockerfile ./Dockerfile
            [ -f /tmp/docker-assets/.dockerignore ] && cp /tmp/docker-assets/.dockerignore ./.dockerignore || true
            
            # Secours pour les tags initiaux (ex: v0.0.0) antérieurs à Composer et public/
            if [ ! -f composer.json ]; then
              echo "composer.json absent sur $tag, creation d'un composer minimal"
              echo '{"name": "aicha/gestion_reservation_salle"}' > composer.json
            fi
            if [ ! -d public ]; then
              echo "public/ absent sur $tag, creation du dossier public"
              mkdir -p public
              echo '<!DOCTYPE html><html><body><h1>Gestion des reservations - Initialisation</h1></body></html>' > public/index.php
            fi
            
            IMAGE_TAG="${DOCKER_USER}/${REPO_NAME}:${tag}"
            EXTRA_TAGS=""
            if [ "$tag" = "$LATEST_TAG" ]; then
              EXTRA_TAGS="-t ${DOCKER_USER}/${REPO_NAME}:latest"
            fi
            
            docker buildx build \
              --platform linux/amd64 \
              -t "$IMAGE_TAG" \
              $EXTRA_TAGS \
              --push \
              .
              
            echo "Pushed $IMAGE_TAG successfully"
          done
